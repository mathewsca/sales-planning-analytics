sales_planning_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5433') | as_number }}"
      user: "{{ env_var('PGUSER', 'analytics') }}"
      password: "{{ env_var('PGPASSWORD', 'analytics') }}"
      dbname: "{{ env_var('PGDATABASE', 'warehouse') }}"
      schema: public
      threads: 4

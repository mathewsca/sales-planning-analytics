name: sales-planning-analytics

# Stack em PROFILES, para subir por partes (máquinas com pouca memória):
#   docker compose up -d postgres                     # só o warehouse (~250 MB)
#   docker compose --profile ml up -d                 # + MLflow
#   docker compose --profile orchestration up -d      # + Airflow (DAG completa)
#   docker compose --profile api up -d                # + FastAPI
#   docker compose --profile bi up -d                 # + Superset (dashboards)
# Portas: Postgres :5433 (host) | MLflow :5000 | Airflow :8080 | API :8000 | Superset :8088
x-project-env: &project-env
  WAREHOUSE_URL: postgresql+psycopg://${PG_USER:-analytics}:${PG_PASSWORD:-analytics}@postgres:5432/warehouse
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${PG_USER:-analytics}
  PGPASSWORD: ${PG_PASSWORD:-analytics}
  PGDATABASE: warehouse
  MLFLOW_TRACKING_URI: http://mlflow:5000
  SNAPSHOT_DATE: "2026-02-18"

x-superset-env: &superset-env
  SUPERSET_CONFIG_PATH: /app/superset_home_config/superset_config.py
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-superset-secret-change-me}
  SUPERSET_DB_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
  WAREHOUSE_BI_URI: postgresql+psycopg2://bi_reader:bi_reader@postgres:5432/warehouse
  MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    command: >
      postgres -c shared_buffers=128MB -c work_mem=16MB -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB -c max_connections=60
    environment:
      POSTGRES_USER: ${PG_USER:-analytics}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-analytics}
      POSTGRES_DB: warehouse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["${PG_HOST_PORT:-5433}:5432"]   # 5433 no host evita conflito com um Postgres local/WSL
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-analytics} -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    profiles: ["ml", "orchestration", "api"]
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlartifacts:/mlartifacts
    ports: ["5000:5000"]
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  airflow:
    profiles: ["orchestration"]
    build: { context: ., dockerfile: docker/airflow.Dockerfile }
    command: standalone
    environment:
      <<: *project-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"                 # máquina modesta: no máximo 2 tasks simultâneas
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/pipelines/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # ambiente local de demonstração
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-secret-change-me}
      DATA_DIR: /opt/project/data
      DBT_PROFILES_DIR: /opt/project/dbt
    volumes:
      - .:/opt/project
    ports: ["8080:8080"]
    mem_limit: 3g
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  api:
    profiles: ["api"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { EXTRAS: api } }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *project-env
    ports: ["8000:8000"]
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  superset:
    profiles: ["bi"]
    build: { context: ., dockerfile: docker/superset.Dockerfile }
    # migra o banco de metadados, garante o admin e sobe o servidor web
    command:
      - sh
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Admin --lastname BI --email admin@example.com --password "$${SUPERSET_ADMIN_PASSWORD}" || true) &&
        superset init &&
        /usr/bin/run-server.sh
    environment:
      <<: *superset-env
    volumes:
      - ./superset:/app/superset_home_config
    ports: ["8088:8088"]
    mem_limit: 1536m
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  superset-init:
    # roda uma vez: migra o banco de metadados, cria papéis/usuários/RLS e importa os dashboards (YAML)
    profiles: ["bi"]
    build: { context: ., dockerfile: docker/superset.Dockerfile }
    command: ["python", "/app/superset_home_config/init_superset.py"]
    environment:
      <<: *superset-env
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    volumes:
      - ./superset:/app/superset_home_config
    depends_on:
      superset: { condition: service_healthy }
    restart: "no"

volumes:
  pgdata:
  mlartifacts:

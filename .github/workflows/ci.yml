name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[api,dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  data-pipeline:
    name: Dados públicos + gerador -> PostgreSQL -> dbt -> modelos -> reporting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: analytics, POSTGRES_PASSWORD: analytics, POSTGRES_DB: warehouse }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U analytics" --health-interval 5s --health-retries 20
    env:
      WAREHOUSE_URL: postgresql+psycopg://analytics:analytics@localhost:5432/warehouse
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: analytics
      PGPASSWORD: analytics
      PGDATABASE: warehouse
      SNAPSHOT_DATE: "2026-02-18"
      GEN_SCALE: "0.15"   # CI usa uma fração do volume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dbt,dev]"
      - name: Schemas e usuário de BI (mesmo init do docker compose)
        run: psql -v ON_ERROR_STOP=0 -f docker/postgres/init.sql || true
      - name: Ciclo completo (sem Airflow, sem MLflow) — inclui dbt build e testes de dados
        run: python scripts/run_local.py --no-mlflow
      # com 15% dos dados o LightGBM empata com o ETS; o critério contra o melhor baseline vale na
      # escala completa (README). Aqui ele precisa vencer as regras simples no teste pareado.
      - name: LightGBM+MinT vence média 3m e catraca (bootstrap pareado, IC 95% < 0)
        run: |
          python - <<'EOF'
          import json
          r = json.load(open("reports/forecast_metrics.json", encoding="utf-8"))
          print(r["summary"]["wape_rep_h1"], r["decision"])
          testes = r["summary"]["teste_pareado_vs_baselines"]
          for regra in ("MA3", "Catraca"):
              assert testes[regra]["ci_high"] < 0, (regra, testes[regra])
          EOF

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile ml --profile orchestration --profile api --profile bi build
